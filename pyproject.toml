[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opentpu-benchmark"
version = "1.0.0"
description = "High-performance microbenchmark suite for Google TPUs (v5e, v4, v5p, v6e)"
readme = "README.md"
authors = [{ name = "kreier" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.26.0",
]

[project.scripts]
opentpu-benchmark = "opentpu.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
