[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opentpu-benchmark"
version = "0.3.4"
description = "High-performance microbenchmark suite for Google TPUs (v5e, v4, v5p, v6e)"
readme = "README.md"
authors = [{ name = "kreier" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.26.0",
]

[project.scripts]
opentpu = "opentpu.main:main"
opentpu-benchmark = "opentpu.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opentpu*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
